<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Weather App</title>
		<link rel="stylesheet" href="./styles/style.css" />
	</head>
	<body>
		<div class="weather-container">
			<h1>Weather</h1>

			<div class="search-box">
				<input
					type="text"
					class="city-input"
					placeholder="Enter city name"
					autocomplete="off"
				/>
				<button class="search-button">Search</button>
				<ul class="suggestions"></ul>
			</div>

			<p class="placeholder">Enter a city to see the weather</p>

			<div class="weather-result hidden">
				<h2 class="city"></h2>
				<img class="weather-image" alt="" />
				<p><b>Temperature: </b> <span class="temperature"></span>°C</p>
				<p><b>Condition: </b> <span class="weather-condition"></span></p>
				<p><b>Wind speed: </b> <span class="wind-speed"></span> km/h</p>

				<div class="forecast"></div>
			</div>
		</div>

		<div class="modal hidden">
			<div class="modal-content">
				<button class="modal-close">&times;</button>
				<h3 class="modal-title"></h3>
				<div class="hourly"></div>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
