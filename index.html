<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Weather App</title>
		<link rel="stylesheet" href="./styles/style.css" />
	</head>
	<body>
		<div class="weather-container">
			<h1>Weather</h1>
			<input type="text" class="city-input" placeholder="Enter city name" />
			<button class="search-button">Search</button>
			<h2 class="city"></h2>
			<img class="weather-image" />
			<p><b>Temperature: </b> <span class="temperature"></span>°C</p>
			<p><b>Condition: </b> <span class="weather-condition"></span></p>
			<p><b>Wind speed: </b> <span class="wind-speed"></span>km/h</p>
		</div>

		<script src="scrypt.js"></script>
	</body>
</html>
